# Lance PostgreSQL dans un conteneur Docker.
# Commande : docker compose up -d     (arrêt : docker compose down)
services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nommé : les données survivent à l'arrêt/suppression du conteneur
      - pgdata:/var/lib/postgresql/data
      # Au tout premier démarrage (volume vide), Postgres exécute les .sql de ce dossier dans l'ordre
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/999_seed.sql:ro
      # (Provisoire : dès que Node est installé, un vrai outil de migration prendra le relais)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
