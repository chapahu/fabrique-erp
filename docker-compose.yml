# Lance PostgreSQL dans un conteneur Docker.
# Commande : docker compose up -d     (arrêt : docker compose down)
services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nommé : les données survivent à l'arrêt/suppression du conteneur
      - pgdata:/var/lib/postgresql/data
      # Le schéma n'est plus créé ici : c'est l'outil de migrations qui s'en charge (npm run db:migrate)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
